    <script>
      /* Animation bootstrap — runs before first paint.
         Sets <html data-motion="full|subtle|off"> so animation CSS never flashes
         hidden content. If JavaScript is disabled the attribute is never set and
         all content renders fully visible and static. If the app bundle fails to
         load, the failsafe below removes the attribute after 4s. */
      (function () {
        try {
          var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          var stored = null;
          try {
            stored = window.localStorage.getItem("sbap:motion");
          } catch (e) {}
          var preset = reduced ? "off" : (stored === "full" || stored === "subtle" || stored === "off") ? stored : "full";
          document.documentElement.setAttribute("data-motion", preset);
          window.__SBAP_MOTION_BOOTSTRAP__ = preset;
          setTimeout(function () {
            if (!window.__SBAP_BOOTED__) document.documentElement.removeAttribute("data-motion");
          }, 4000);
        } catch (e) {}
      })();
    </script>
